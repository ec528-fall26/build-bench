name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11: the competition runtime (agent.yaml, profile python-3.11).
        # 3.12: the AWS host the harness runs on (Ubuntu 24.04).
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          # The tests need only these folders. Skipping the rest avoids
          # downloading ~1.3 GB of committed starter-kit run output.
          sparse-checkout: |
            buildbench-starter-kit-0.1.0-rc.2/agents/one-shot
            harness
            part1-agent-shell
            part2-log-tail
            part4-edit-applier

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Standard library only: nothing to install.

      - name: Part 1 — baseline contract
        run: python -m unittest discover -s part1-agent-shell/tests -v

      - name: Part 2 — log tail
        run: python -m unittest discover -s part2-log-tail/tests -v

      - name: Part 4 — edit applier
        run: python -m unittest discover -s part4-edit-applier/tests -v

      - name: Part 5 — harness
        run: python -m unittest discover -s harness/tests -t . -v
