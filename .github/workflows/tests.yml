name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11: the competition runtime (agent.yaml, profile python-3.11).
        # 3.12: the AWS host the harness runs on (Ubuntu 24.04).
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          # The tests need only these folders. Skipping the rest avoids
          # downloading ~1.3 GB of committed starter-kit run output.
          sparse-checkout: |
            buildbench-starter-kit-0.1.0-rc.2/agents/one-shot
            buildbench-starter-kit-0.1.0-rc.2/agents/full-agent
            harness
            tests

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Standard library only: nothing to install.
      # One step per folder: both agents are packages named `src`, so a
      # single run would test whichever agent Python imported first.

      - name: Part 1 — baseline contract
        run: python -m unittest discover -s tests/one-shot/part1-agent-shell -v

      - name: Part 2 — log tail
        run: python -m unittest discover -s tests/one-shot/part2-log-tail -v

      - name: Part 3 — model client
        run: python -m unittest discover -s tests/one-shot/part3-model-client -v

      - name: Part 4 — edit applier
        run: python -m unittest discover -s tests/one-shot/part4-edit-applier -v

      - name: Part 5 — harness
        run: python -m unittest discover -s harness/tests -t . -v

      - name: Full agent — contracts and stand-ins
        run: python -m unittest discover -s tests/full-agent -v
